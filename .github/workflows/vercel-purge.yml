name: Vercel Deploy & Purge

on:
  push:
    branches: [main]

jobs:
  deploy-and-purge:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_NynC1t2A3tuZxBbR6zZj9i1o
      VERCEL_PROJECT_ID: prj_k3bjwBeQhlPV8jCUyk2p4wGtlwHG
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: dragonrpa
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy & Purge (when VERCEL_TOKEN is configured)
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "[Skip] secrets.VERCEL_TOKEN 미설정 상태이므로 CI 배포 및 슬롯 정리를 건너뜁니다."
            exit 0
          fi
          npm install -g vercel@latest
          mkdir -p .vercel
          printf '{"projectId":"prj_k3bjwBeQhlPV8jCUyk2p4wGtlwHG","orgId":"team_NynC1t2A3tuZxBbR6zZj9i1o","projectName":"ebro_fl"}\n' > .vercel/project.json
          vercel deploy --prod --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_SCOPE"
          node scripts/auto_purge_vercel.cjs --keep=3
